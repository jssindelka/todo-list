<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>Todo</title>
<meta name="description" content="A quiet to-do list.">

<!-- PWA / iOS home screen -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#E9E9E7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Todo">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<style>
/* ═══════════════════════════════════════════════════════════════════
   FONTS — embedded base64, so the app renders identically offline and
   never blocks on a network request. Both are variable fonts: one file
   per family covers every weight.
   ═══════════════════════════════════════════════════════════════════ */
@font-face{font-family:'Doto';font-style:normal;font-weight:100 900;font-display:block;
  src:url(data:font/woff2;base64,@FONT_DOTO@) format('woff2');}
@font-face{font-family:'JB Mono';font-style:normal;font-weight:100 800;font-display:block;
  src:url(data:font/woff2;base64,@FONT_MONO@) format('woff2');}

/* ═══════════════════════════════════════════════════════════════════
   TOKENS
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --f-dot:'Doto',ui-monospace,monospace;
  --f-mono:'JB Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --pad:24px;
  --ease:cubic-bezier(.2,.7,.3,1);
}
/* light is the base; dark overrides. Both are reachable three ways:
   OS setting, or an explicit data-theme stamp from the menu.        */
:root,
:root[data-theme="light"]{
  --bg:#E9E9E7; --bg-elev:#F1F1EF; --bg-sheet:#F3F3F1;
  --line:rgba(0,0,0,.22); --line-soft:rgba(0,0,0,.10);
  /* --fg-dim carries real text, so it clears 4.5:1; --fg-faint is for
     strokes and decoration only, and clears the 3:1 bar for UI shapes. */
  --fg:#0A0A0A; --fg-dim:rgba(0,0,0,.58); --fg-faint:rgba(0,0,0,.46);
  --knock:#F1F1EF; --scrim:rgba(0,0,0,.35);
  --accent:#B3141B;   /* Nothing red, darkened to clear 4.5:1 on this bg */
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --bg-elev:#0B0B0B; --bg-sheet:#0E0E0E;
    --line:rgba(255,255,255,.17); --line-soft:rgba(255,255,255,.075);
    --fg:#FFFFFF; --fg-dim:rgba(255,255,255,.56); --fg-faint:rgba(255,255,255,.46);
    --knock:#000000; --scrim:rgba(0,0,0,.6);
    --accent:#F52C36; /* same red, lifted to clear 4.5:1 on black */
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --bg-elev:#0B0B0B; --bg-sheet:#0E0E0E;
  --line:rgba(255,255,255,.17); --line-soft:rgba(255,255,255,.075);
  --fg:#FFFFFF; --fg-dim:rgba(255,255,255,.56); --fg-faint:rgba(255,255,255,.46);
  --knock:#000000; --scrim:rgba(0,0,0,.6);
  --accent:#F52C36; /* same red, lifted to clear 4.5:1 on black */
}

*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;height:100%;}
body{
  margin:0;height:100%;background:var(--bg);color:var(--fg);
  font-family:var(--f-mono);font-weight:400;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,textarea{font:inherit;color:inherit;}
button{background:none;border:0;padding:0;cursor:pointer;}
/* removes the ~300ms double-tap-zoom delay and stops a mistimed
   second tap zooming the page instead of activating the control */
button,.chk,.disc,.chip,.seg button{touch-action:manipulation;}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:2px;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* ═══════════════════════════════════════════════════════════════════
   APP FRAME — ref 1's structure: header, rule, count, void, list, bar
   ═══════════════════════════════════════════════════════════════════ */
#app{
  /* 100% resolves against <html>, which on iOS standalone can be taller
     than what you can actually see — dvh tracks the real viewport. */
  height:100vh; height:-webkit-fill-available; height:100dvh;
  display:flex;flex-direction:column;
  max-width:600px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 26px) var(--pad)
          calc(env(safe-area-inset-bottom) + 18px);
}

/* ── header ─────────────────────────────────────────────────────── */
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
.greet{
  font-family:var(--f-dot);font-weight:700;
  font-size:clamp(24px,7.4vw,32px);line-height:1.1;letter-spacing:.015em;
  text-transform:uppercase;margin:0;
}
.hd-btn{
  width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;
  border-radius:50%;color:var(--fg);transition:opacity .2s;
}
.hd-btn:hover{opacity:.6;}
.hd-btn:active{transform:scale(.92);}
.hd-actions{display:flex;align-items:center;gap:2px;flex:0 0 auto;}
.globe{width:36px;height:36px;stroke:currentColor;fill:none;stroke-width:1;}
.dots{width:20px;height:20px;fill:currentColor;}

.rule{height:1px;background:var(--line);margin:18px 0 14px;flex:0 0 auto;}

.count{
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-dim);
  flex:0 0 auto;min-height:16px;
}

/* ── the void: ref 1's defining move, filled with a dot-matrix field ── */
.void{
  flex:1 1 auto;min-height:24px;position:relative;
}
/* A capped, centred band rather than wallpaper — it should read as a
   deliberate mark in the empty space, not fill it.                    */
.void::after{
  content:'';position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  height:min(100%,240px);opacity:.5;pointer-events:none;
  background-image:radial-gradient(var(--line) .9px,transparent .9px);
  background-size:15px 15px;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 40%,#000 60%,transparent);
          mask-image:linear-gradient(180deg,transparent,#000 40%,#000 60%,transparent);
}
.void .empty{
  position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  text-align:center;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--fg-dim);
}

/* ── list ───────────────────────────────────────────────────────── */
.list{
  position:relative;   /* offsetParent for the drag measurements */
  flex:0 1 auto;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;
}
.list::-webkit-scrollbar{width:3px;}
.list::-webkit-scrollbar-thumb{background:var(--line);}

.item{border-bottom:1px solid var(--line-soft);}
.item:last-child{border-bottom:0;}

/* ── drag to reorder ────────────────────────────────────────────── */
.item{transition:transform .18s var(--ease);}
.item--drag{
  transition:none;position:relative;z-index:5;
  background:var(--bg-elev);box-shadow:0 0 0 1px var(--line);
  cursor:grabbing;
}
.list--dragging{cursor:grabbing;-webkit-user-select:none;user-select:none;}
.list--dragging .chev{opacity:0;}
/* the pointer is captured during a drag, so nothing below should react */
.list--dragging .item:not(.item--drag){pointer-events:none;}
@media (hover:hover){ .row{cursor:grab;} .item--drag .row{cursor:grabbing;} }

/* ── swipe to send to Today ─────────────────────────────────────── */
.swipe{position:relative;overflow:hidden;}
.swipe-actions{
  position:absolute;inset:0 auto 0 0;width:88px;
  display:flex;align-items:center;justify-content:center;
}
.today-btn{
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--line);color:var(--fg);
  transition:background .2s var(--ease),color .2s var(--ease),border-color .2s;
}
.today-btn svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.4;fill:none;}
.today-btn:hover{background:var(--fg);color:var(--knock);border-color:var(--fg);}
.item--today .today-btn{background:var(--fg);color:var(--knock);border-color:var(--fg);}

/* the row itself slides, revealing the action beneath it */
.swipe .row{
  position:relative;background:var(--bg);
  transition:transform .22s var(--ease);
}
.item--drag .swipe .row,.swiping .row{transition:none;}
.item--open .swipe .row{background:var(--bg);}

/* on desktop the same action is a hover-revealed button — a swipe is a
   thumb gesture and has no good mouse equivalent */
.row-today{
  width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  color:var(--fg-faint);opacity:0;transition:opacity .18s,color .2s;
}
.row-today svg{width:13px;height:13px;stroke:currentColor;stroke-width:1.5;fill:none;}
@media (hover:hover){
  .row:hover .row-today,.row-today:focus-visible{opacity:1;}
  .row-today:hover{color:var(--fg);}
  .item--today .row-today{opacity:1;color:var(--fg);}
}
@media (hover:none){ .row-today{display:none;} }

/* a task already picked for today, seen from the Personal/Work backlog */
.cat .dot{
  display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--fg);margin-right:7px;vertical-align:middle;
}

/* one-time nudge, retired the first time a task is moved */
.reorder-hint{
  flex:0 0 auto;font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--fg-dim);padding-bottom:8px;
}

.row{
  display:grid;grid-template-columns:23px 1fr auto 16px;gap:15px;align-items:center;
  width:100%;text-align:left;
}
@media (hover:none){ .row{grid-template-columns:23px 1fr 16px;} }
.chk{
  width:23px;height:23px;border-radius:50%;border:1px solid var(--fg-faint);
  display:grid;place-items:center;background:transparent;flex:0 0 23px;
  position:relative;
  transition:border-color .18s var(--ease),background .18s var(--ease),transform .12s var(--ease);
}
/* keeps the 23px circle but gives the finger a 44px target */
.chk::before{content:'';position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;}
.chk:hover{border-color:var(--fg);}
.chk:active{transform:scale(.9);}
.chk svg{
  width:11px;height:11px;stroke:var(--knock);stroke-width:2.2;fill:none;
  stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:16;stroke-dashoffset:16;
}
.item--done .chk{background:var(--fg);border-color:var(--fg);}
.item--done .chk svg{stroke-dashoffset:0;transition:stroke-dashoffset .22s var(--ease) .05s;}

.disc{
  min-width:0;width:100%;text-align:left;
  padding:13px 0;min-height:44px;          /* the padding is the hit area */
  display:flex;flex-direction:column;justify-content:center;
}
.ttl{
  display:block;
  font-size:13px;letter-spacing:.07em;text-transform:uppercase;font-weight:500;
  line-height:1.35;overflow-wrap:anywhere;
}
.cat{
  display:block;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-dim);margin-top:3px;
}
.item--done .ttl{color:var(--fg-dim);text-decoration:line-through;text-decoration-thickness:1px;}
.item--done .cat{color:var(--fg-dim);}

.chev{
  display:grid;place-items:center;color:var(--fg-faint);
  transition:transform .22s var(--ease),color .2s;
}
.chev svg{width:7px;height:12px;stroke:currentColor;stroke-width:1.4;fill:none;}
.row:hover .chev{color:var(--fg-dim);}
.item--open .chev{transform:rotate(90deg);color:var(--fg-dim);}

/* ── expanded detail ────────────────────────────────────────────── */
.detail{display:none;padding:0 0 16px 38px;}
.item--open .detail{display:block;}
.detail .notes{
  font-size:12px;line-height:1.8;letter-spacing:.02em;color:var(--fg-dim);
  padding-left:14px;border-left:1px solid var(--line);white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.detail .notes:empty::before{content:'No notes.';color:var(--fg-dim);font-style:italic;}
.acts{display:flex;gap:8px;margin-top:2px;padding-left:2px;}
.mini{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-dim);
  transition:color .2s;padding:11px 12px;min-height:44px;
  display:inline-flex;align-items:center;}
.mini:hover{color:var(--fg);}
.mini--del{color:var(--accent);}
.mini--del:hover{color:var(--accent);opacity:.75;}

/* ── bottom bar ─────────────────────────────────────────────────── */
.foot{flex:0 0 auto;padding-top:14px;margin-top:12px;border-top:1px solid var(--line);}
.bar{display:flex;align-items:center;gap:12px;}
.seg{flex:1;display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;min-width:0;}
.seg button{
  flex:1;border-radius:999px;padding:9px 4px;min-width:0;
  min-height:44px;                    /* Apple HIG minimum touch target */
  display:grid;place-items:center;
  font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:500;
  color:var(--fg-dim);transition:background .22s var(--ease),color .22s var(--ease);
}
.seg button[aria-selected="true"]{background:var(--fg);color:var(--knock);}
.fab{
  width:46px;height:46px;flex:0 0 46px;border-radius:50%;border:1px solid var(--line);
  color:var(--fg);display:grid;place-items:center;transition:background .2s,color .2s,transform .12s;
}
.fab svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.3;}
.fab:hover{background:var(--fg);color:var(--knock);}
.fab:active{transform:scale(.93);}

/* ═══════════════════════════════════════════════════════════════════
   OVERLAYS — add sheet + menu
   ═══════════════════════════════════════════════════════════════════ */
.scrim{
  position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;
  transition:opacity .25s var(--ease);z-index:10;
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
}
.scrim[data-open="true"]{opacity:1;pointer-events:auto;}

.sheet{
  /* Without this the closed sheet stays in the layer and swallows clicks.
     Invisible is not the same as gone — on desktop it is centred on screen,
     so everything under it silently stops responding. */
  pointer-events:none;
  position:fixed;left:0;right:0;bottom:0;z-index:11;
  background:var(--bg-sheet);border-top:1px solid var(--line);
  border-radius:18px 18px 0 0;
  padding:24px var(--pad) calc(env(safe-area-inset-bottom) + 22px);
  transform:translateY(100%);transition:transform .3s var(--ease);
  max-height:92vh;overflow-y:auto;
}
.sheet[data-open="true"]{transform:translateY(0);pointer-events:auto;}
.sheet-hd{
  display:flex;justify-content:space-between;align-items:center;
  padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid var(--line-soft);
}
.sheet-hd h2{font-size:10px;letter-spacing:.2em;text-transform:uppercase;margin:0;font-weight:400;}
.sheet-hd .mini{padding:11px 0 11px 12px;margin:-11px 0;}

.field{margin-bottom:20px;}
.field > label{
  display:block;font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--fg-dim);margin-bottom:9px;
}
.field input[type=text],.field textarea{
  width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);
  padding:0 0 9px;outline:none;resize:none;border-radius:0;
}
.field input[type=text]{font-size:16px;letter-spacing:.06em;text-transform:uppercase;}
.field textarea{font-size:13px;line-height:1.7;letter-spacing:.02em;min-height:58px;}
.field input::placeholder,.field textarea::placeholder{color:var(--fg-dim);text-transform:none;letter-spacing:.02em;}
.field input:focus,.field textarea:focus{border-bottom-color:var(--fg);}
.field input:focus-visible,.field textarea:focus-visible{outline:none;}

.chips{display:flex;gap:8px;}
.chip{
  border:1px solid var(--line);border-radius:999px;padding:9px 17px;color:var(--fg-dim);
  font-size:10px;letter-spacing:.13em;text-transform:uppercase;transition:.2s var(--ease);
}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--knock);border-color:var(--fg);}

.btn{
  width:100%;padding:15px;border:1px solid var(--fg);background:var(--fg);color:var(--knock);
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;border-radius:999px;
  transition:opacity .2s;
}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.hint{
  margin:12px 0 0;text-align:center;font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--fg-dim);
}

/* ── menu ───────────────────────────────────────────────────────── */
.menu{
  position:fixed;z-index:11;top:calc(env(safe-area-inset-top) + 72px);right:var(--pad);
  width:min(268px,calc(100vw - 2*var(--pad)));
  background:var(--bg-sheet);border:1px solid var(--line);
  padding:18px;opacity:0;transform:translateY(-6px) scale(.98);
  transform-origin:top right;pointer-events:none;
  transition:opacity .2s var(--ease),transform .2s var(--ease);
}
.menu[data-open="true"]{opacity:1;transform:none;pointer-events:auto;}
.menu-grp + .menu-grp{margin-top:18px;padding-top:16px;border-top:1px solid var(--line-soft);}
.menu-lbl{
  display:block;font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--fg-dim);margin-bottom:10px;
}
.menu .seg{border-radius:999px;}
.menu .seg button{padding:7px 3px;font-size:9px;letter-spacing:.1em;min-height:40px;}
.menu input[type=text]{
  width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);
  padding:0 0 7px;outline:none;font-size:13px;letter-spacing:.05em;text-transform:uppercase;border-radius:0;
}
.menu input:focus{border-bottom-color:var(--fg);}
.menu-act{
  display:block;width:100%;text-align:left;padding:9px 0;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-dim);
  transition:color .2s;min-height:44px;
}
.menu-act:hover{color:var(--fg);}
.menu-act--del{color:var(--accent);}
.sync-hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px;}
.sync-hd .mini{padding:6px 0;min-height:auto;}
.sync-state{
  margin:0 0 10px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-dim);
}
.sync-note{
  margin:0 0 10px;font-size:10px;line-height:1.7;letter-spacing:.02em;
  color:var(--fg-dim);text-transform:none;
}
#syncLink{
  width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);
  padding:0 0 7px;outline:none;font-size:10px;letter-spacing:.02em;
  color:var(--fg-dim);text-transform:none;border-radius:0;
}

/* ═══════════════════════════════════════════════════════════════════
   TOAST — undo affordance for destructive actions
   ═══════════════════════════════════════════════════════════════════ */
.toast{
  position:fixed;z-index:12;left:50%;bottom:calc(env(safe-area-inset-bottom) + 88px);
  transform:translate(-50%,14px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:18px;
  background:var(--fg);color:var(--knock);padding:12px 18px;border-radius:999px;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;
  transition:opacity .22s var(--ease),transform .22s var(--ease);
}
.toast[data-open="true"]{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
.toast button{color:inherit;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:700;text-decoration:underline;text-underline-offset:3px;}

/* ═══════════════════════════════════════════════════════════════════
   DESKTOP — same structure, but the void is capped so a big screen
   reads as composed rather than empty, and the sheet becomes a dialog.
   ═══════════════════════════════════════════════════════════════════ */
@media (min-width:768px){
  :root{--pad:32px;}
  #app{padding-top:56px;padding-bottom:40px;}
  .greet{font-size:38px;}
  .globe{width:40px;height:40px;}
  .hd-btn{width:44px;height:44px;flex-basis:44px;}
  /* No cap: the void has to absorb the slack, or a short list leaves the
     tab bar stranded in the middle of the screen. Ref 1's list is
     bottom-anchored and that should hold at every size. */
  .seg button{min-height:38px;}
  .mini{min-height:auto;padding:6px 10px;}
  .acts{margin-top:10px;}
  .ttl{font-size:14px;}
  .row{padding:15px 0;grid-template-columns:24px 1fr 16px;}

  .sheet{
    left:50%;bottom:auto;top:50%;right:auto;
    transform:translate(-50%,-46%) scale(.98);
    width:min(480px,calc(100vw - 64px));border:1px solid var(--line);
    border-radius:4px;padding:26px 28px 24px;
    opacity:0;transition:opacity .22s var(--ease),transform .22s var(--ease);
  }
  .sheet[data-open="true"]{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto;}
  /* keep the menu tucked under the globe: the column is centred and
     capped at 600px, so its right edge sits 50vw - 300px from the wall */
  .menu{top:96px;right:max(var(--pad), calc(50vw - 300px + 32px));}
  .toast{bottom:40px;}
}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important;}
}
</style>
</head>
<body>

<main id="app">
  <header class="hd">
    <h1 class="greet" id="greet">Good Morning</h1>
    <div class="hd-actions">
      <button class="hd-btn" id="themeBtn" aria-label="Switch theme">
        <svg class="globe" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="15"/><ellipse cx="20" cy="20" rx="6" ry="15"/>
          <ellipse cx="20" cy="20" rx="12.5" ry="15"/>
          <line x1="5" y1="20" x2="35" y2="20"/>
          <line x1="7.6" y1="12" x2="32.4" y2="12"/><line x1="7.6" y1="28" x2="32.4" y2="28"/>
        </svg>

  <div class="rule"></div>

  <footer class="foot">
    <div class="bar">

        <button role="tab" data-filter="today"    aria-selected="true">Today</button>
        <button role="tab" data-filter="personal" aria-selected="false">Personal</button>
        <button role="tab" data-filter="work"     aria-selected="false">Work</button>

      <button class="fab" id="addBtn" aria-label="New task">
        <svg viewBox="0 0 15 15" aria-hidden="true"><path d="M7.5 1v13M1 7.5h13"/></svg>
      </button>
    </div>
  </footer>
</main>

<div class="scrim" id="scrim"></div>

<!-- ── add / edit sheet ──────────────────────────────────────────── -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTtl">
  <div class="sheet-hd">
    <h2 id="sheetTtl">New task</h2>
    <button class="mini" id="sheetClose">Close</button>
  </div>
  <form id="form">

      <label for="fTitle">Task</label>

             placeholder="What needs doing?" maxlength="200" required>

    <div class="field">

      <div class="chips" role="group" aria-labelledby="catLbl">
        <button type="button" class="chip" data-cat="personal" aria-pressed="true">Personal</button>
        <button type="button" class="chip" data-cat="work"     aria-pressed="false">Work</button>
      </div>
    </div>
    <div class="field">
      <label for="fNotes">Notes — optional</label>
      <textarea id="fNotes" rows="2" maxlength="2000" placeholder="Anything worth remembering…"></textarea>
    </div>

    <p class="hint" id="formHint">Enter to save · Esc to close</p>
  </form>

<!-- ── menu ──────────────────────────────────────────────────────── -->
<div class="menu" id="menu" role="dialog" aria-label="Settings">
  <div class="menu-grp">
    <span class="menu-lbl">Appearance</span>
    <div class="seg" role="tablist" aria-label="Theme">
      <button role="tab" data-theme="system" aria-selected="true">Auto</button>
      <button role="tab" data-theme="light"  aria-selected="false">Light</button>
      <button role="tab" data-theme="dark"   aria-selected="false">Dark</button>
    </div>
  </div>
  <div class="menu-grp">
    <label class="menu-lbl" for="fName">Your name</label>
    <input type="text" id="fName" maxlength="24" autocomplete="off" placeholder="Name">
  </div>
  <div class="menu-grp">
    <div class="sync-hd">
      <span class="menu-lbl" style="margin:0;">Sync</span>
      <button class="mini" id="syncToggle">Turn on</button>
    </div>

    <div id="syncPanel" hidden>
      <p class="sync-note">Open this link on your other device to share this list. Treat it like a password.</p>
      <input type="text" id="syncLink" readonly spellcheck="false">
      <button class="menu-act" id="syncCopy">Copy link</button>
    </div>
  </div>

  <div class="menu-grp">
    <span class="menu-lbl">Your data</span>
    <button class="menu-act" id="expBtn">Export backup</button>
    <button class="menu-act" id="impBtn">Import backup</button>

<div class="toast" id="toast" role="status">
  <span id="toastMsg"></span>
  <button id="toastAct">Undo</button>
</div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════
   STORAGE SEAM
   Every read and write in the app goes through this one interface.
   Swapping localStorage for a synced backend later means writing a
   second adapter with the same two methods and calling Store.use() —
   nothing above this line has to change.
   ═══════════════════════════════════════════════════════════════════ */
const Store = (() => {
  const KEY = 'todo.v1';
  const EMPTY = () => ({
    version:2, tasks:[],
    prefs:{ theme:'system', filter:'today', name:'', reordered:false },
    // theme and filter stay device-local on purpose; only the list travels
    sync:{ key:'', enabled:false, lastSyncAt:0, orderUpdatedAt:0, nameUpdatedAt:0 }
  });

  const localAdapter = {
    read(){
      try{
        const raw = localStorage.getItem(KEY);
        if(!raw) return EMPTY();
        const d = JSON.parse(raw);
        return migrate(d);
      }catch(e){
        console.warn('Could not read saved tasks; starting fresh.', e);
        return EMPTY();
      }
    },
    write(state){
      try{ localStorage.setItem(KEY, JSON.stringify(state)); return true; }
      catch(e){ console.warn('Could not save.', e); return false; }
    }
  };

  /* Version the shape now so a future migration is a switch, not a guess. */
  function migrate(d){
    if(!d || typeof d !== 'object') return EMPTY();
    const base = EMPTY();
    const tasks = Array.isArray(d.tasks) ? d.tasks.filter(valid).map(normalise) : [];
    const p = { ...base.prefs, ...(d.prefs||{}) };
    // 'all' is gone; anything unrecognised lands on Today
    if(!['today','personal','work'].includes(p.filter)) p.filter = 'today';
    return {
      version:2, tasks,
      prefs:p,
      sync:{ ...base.sync, ...(d.sync||{}) }
    };
  }
  const valid = t => t && typeof t === 'object' && typeof t.id !== 'undefined'
    && (t.deletedAt || (typeof t.title === 'string' && t.title.trim()));
  const normalise = t => ({
    id: String(t.id || uid()),
    title: String(t.title || '').slice(0,200),
    category: t.category === 'work' ? 'work' : 'personal',
    notes: typeof t.notes === 'string' ? t.notes.slice(0,2000) : '',
    done: !!t.done,
    today: !!t.today,
    createdAt: Number(t.createdAt) || Date.now(),
    completedAt: t.completedAt ? Number(t.completedAt) : null,
    // pre-sync data has no updatedAt; createdAt is the honest fallback
    updatedAt: Number(t.updatedAt) || Number(t.createdAt) || Date.now(),
    deletedAt: t.deletedAt ? Number(t.deletedAt) : null
  });

  let adapter = localAdapter;
  return {
    use(a){ adapter = a; },
    read: () => adapter.read(),
    write: s => adapter.write(s),
    migrate, EMPTY
  };
})();

function uid(){
  return (crypto?.randomUUID?.() || 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2,8));
}

/* ═══════════════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════════════ */
let state = Store.read();
let openId = null;          // which task is expanded
let editingId = null;       // null = the sheet is adding, not editing
let draftCat = 'personal';
let undo = null;            // { label, restore }
let toastTimer = null;

const save = () => Store.write(state);
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

/* ═══════════════════════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════════════════════ */
const WORDS = ['no','one','two','three','four','five','six','seven','eight','nine','ten',
               'eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen',
               'eighteen','nineteen','twenty'];

function greeting(){
  const h = new Date().getHours();
  const part = h < 12 ? 'Morning' : h < 18 ? 'Afternoon' : 'Evening';
  const name = (state.prefs.name || '').trim();
  return name ? `Good ${part},\n${name}` : `Good ${part}`;
}

/* The array order of state.tasks IS the user's chosen order — dragging
   splices that array, so there is no separate index to keep in sync and
   nothing to migrate. Display only partitions it: open work above, done
   below, each group keeping its array order. */
const live = () => state.tasks.filter(t => !t.deletedAt);

function visible(){
  const f = state.prefs.filter;
  const list = f === 'today'
    ? live().filter(t => t.today)          // what you committed to
    : live().filter(t => t.category === f); // the backlog it came from
  return list.filter(t => !t.done).concat(list.filter(t => t.done));
}

/* Unfinished work carries over on its own; a task only leaves Today once
   the day you finished it has passed, so completing something late in the
   evening still reads as done rather than vanishing under your thumb.
   Deliberately invisible — no dates appear anywhere in the UI. */
function rolloverToday(){
  const midnight = new Date(); midnight.setHours(0,0,0,0);
  const cutoff = midnight.getTime();
  let changed = false;
  state.tasks.forEach(t => {
    if(t.today && t.done && (t.completedAt || 0) < cutoff){
      t.today = false; t.updatedAt = Date.now(); changed = true;
    }
  });
  if(changed) save();
  return changed;
}

function toggleToday(id){
  const t = state.tasks.find(x => x.id === id);
  if(!t) return;
  t.today = !t.today;
  t.updatedAt = Date.now();
  save(); render(); Sync.schedule();
  announce(t.today ? `${t.title} added to today` : `${t.title} removed from today`);
}

function render(){
  // header
  $('#greet').textContent = greeting();
  $('#greet').style.whiteSpace = 'pre-line';

  // count line — ref 1's exact phrasing, with the number spelled out
  const open = visible().filter(t => !t.done).length;
  const f = state.prefs.filter;
  const word = WORDS[open] || open;
  $('#count').textContent = f === 'today'
    ? (open === 0
        ? (visible().length ? 'All clear for today' : 'Nothing picked for today')
        : `You have ${word} task${open === 1 ? '' : 's'} for today`)
    : (open === 0
        ? `No open ${f} tasks`
        : `${word.charAt(0).toUpperCase()}${word.slice(1)} open ${f} task${open === 1 ? '' : 's'}`);

  // list
  const items = visible();
  const list = $('#list');
  list.innerHTML = '';
  items.forEach(t => list.appendChild(itemEl(t)));

  // one-time nudge that reordering exists at all
  const hint = $('#reorderHint');
  hint.hidden = state.prefs.reordered || items.length < 2;

  // the void's caption only makes sense when there is genuinely nothing
  const v = $('#void');
  v.innerHTML = '';
  if(items.length === 0){
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = live().length === 0 ? 'Nothing here yet'
      : state.prefs.filter === 'today' ? 'Swipe a task in to start the day'
      : 'Nothing in this filter';
    v.appendChild(p);
  }

  $('#themeBtn').setAttribute('aria-label',
    isDark() ? 'Switch to light theme' : 'Switch to dark theme');

  // filters
  $$('.seg button[data-filter]').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.filter === state.prefs.filter)));

  // menu mirrors
  $$('.menu button[data-theme]').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.theme === state.prefs.theme)));
  if($('#fName') !== document.activeElement) $('#fName').value = state.prefs.name || '';
}

function itemEl(t){
  const wrap = document.createElement('div');
  wrap.className = 'item'
    + (t.done ? ' item--done' : '')
    + (openId === t.id ? ' item--open' : '')
    + (t.today ? ' item--today' : '');
  wrap.dataset.id = t.id;

  const row = document.createElement('div');
  row.className = 'row';

  const chk = document.createElement('button');
  chk.className = 'chk';
  chk.setAttribute('aria-pressed', String(t.done));
  chk.setAttribute('aria-label', (t.done ? 'Mark not done: ' : 'Mark done: ') + t.title);
  chk.innerHTML = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1.6 6.2 4.4 9 10.4 3"/></svg>';
  chk.addEventListener('click', e => { e.stopPropagation(); toggle(t.id); });

  const disc = document.createElement('button');
  disc.className = 'disc';
  disc.setAttribute('aria-expanded', String(openId === t.id));
  disc.setAttribute('aria-label', `${t.title} — ${t.category}. Show notes and actions.`);
  disc.innerHTML = `<span class="ttl"></span><span class="cat"></span>`;
  disc.querySelector('.ttl').textContent = t.title;
  const cat = disc.querySelector('.cat');
  // in the Today view every row is in Today, so the dot would be noise
  if(t.today && state.prefs.filter !== 'today'){
    const dot = document.createElement('span');
    dot.className = 'dot'; dot.setAttribute('aria-hidden','true');
    cat.appendChild(dot);
    cat.appendChild(document.createTextNode(t.category + ' · today'));
  }else{
    cat.textContent = t.category;
  }
  // a drag ends with a click event too — ignore that one, or every reorder
  // would also toggle the notes open
  disc.addEventListener('click', () => {
    if(Drag.consumedClick()) return;
    if(Swipe.isOpen()){ Swipe.closeAll(); return; }
    openId = openId === t.id ? null : t.id; render();
  });
  disc.addEventListener('keydown', e => {
    if(!e.altKey) return;
    if(e.key === 'ArrowUp'){ e.preventDefault(); nudge(t.id, -1); }
    if(e.key === 'ArrowDown'){ e.preventDefault(); nudge(t.id, 1); }
  });

  // desktop equivalent of the swipe: revealed on hover, and reachable by
  // keyboard, which a thumb gesture never is
  const rowToday = document.createElement('button');
  rowToday.className = 'row-today';
  rowToday.innerHTML = '<svg viewBox="0 0 15 15" aria-hidden="true"><circle cx="7.5" cy="7.5" r="3.4"/><path d="M7.5 .8v2M7.5 12.2v2M.8 7.5h2M12.2 7.5h2M2.75 2.75l1.4 1.4M10.85 10.85l1.4 1.4M12.25 2.75l-1.4 1.4M4.15 10.85l-1.4 1.4"/></svg>';
  rowToday.setAttribute('aria-pressed', String(!!t.today));
  rowToday.setAttribute('aria-label', (t.today ? 'Remove from today: ' : 'Add to today: ') + t.title);
  rowToday.addEventListener('click', e => { e.stopPropagation(); toggleToday(t.id); });

  const chev = document.createElement('span');
  chev.className = 'chev';
  chev.setAttribute('aria-hidden','true');
  chev.innerHTML = '<svg viewBox="0 0 7 12"><path d="M1 1l5 5-5 5"/></svg>';

  row.append(chk, disc, rowToday, chev);

  const swipe = document.createElement('div');
  swipe.className = 'swipe';
  const actions = document.createElement('div');
  actions.className = 'swipe-actions';
  const swipeToday = document.createElement('button');
  swipeToday.className = 'today-btn';
  swipeToday.innerHTML = '<svg viewBox="0 0 15 15" aria-hidden="true"><circle cx="7.5" cy="7.5" r="3.4"/><path d="M7.5 .8v2M7.5 12.2v2M.8 7.5h2M12.2 7.5h2M2.75 2.75l1.4 1.4M10.85 10.85l1.4 1.4M12.25 2.75l-1.4 1.4M4.15 10.85l-1.4 1.4"/></svg>';
  swipeToday.setAttribute('aria-label', (t.today ? 'Remove from today: ' : 'Add to today: ') + t.title);
  swipeToday.addEventListener('click', e => {
    e.stopPropagation(); Swipe.closeAll(); toggleToday(t.id);
  });
  actions.appendChild(swipeToday);
  swipe.append(actions, row);

  row.addEventListener('pointerdown', e => {
    Swipe.maybeStart(e, wrap, row);
    Drag.maybeStart(e, wrap);
  });

  const detail = document.createElement('div');
  detail.className = 'detail';
  const notes = document.createElement('p');
  notes.className = 'notes';
  notes.textContent = t.notes || '';
  const acts = document.createElement('div');
  acts.className = 'acts';
  const todayAct = document.createElement('button');
  todayAct.className = 'mini';
  todayAct.textContent = t.today ? 'Not today' : 'Today';
  todayAct.addEventListener('click', () => toggleToday(t.id));
  const edit = document.createElement('button');
  edit.className = 'mini'; edit.textContent = 'Edit';
  edit.addEventListener('click', () => openSheet(t.id));
  const del = document.createElement('button');
  del.className = 'mini mini--del'; del.textContent = 'Delete';
  del.addEventListener('click', () => remove(t.id));
  acts.append(todayAct, edit, del);
  detail.append(notes, acts);

  wrap.append(swipe, detail);
  return wrap;
}

/* ═══════════════════════════════════════════════════════════════════
   MUTATIONS — each destructive one is undoable
   ═══════════════════════════════════════════════════════════════════ */
function toggle(id){
  const i = state.tasks.findIndex(x => x.id === id);
  if(i < 0) return;
  const t = state.tasks[i];
  t.done = !t.done;
  t.completedAt = t.done ? Date.now() : null;
  t.updatedAt = Date.now();

  // move it in the array rather than sorting around it: finishing drops the
  // task to the bottom, un-finishing returns it to the end of the open group
  state.tasks.splice(i,1);
  if(t.done){
    state.tasks.push(t);
  }else{
    let lastOpen = -1;
    state.tasks.forEach((x,j) => { if(!x.done) lastOpen = j; });
    state.tasks.splice(lastOpen + 1, 0, t);
  }
  bumpOrder();
  save(); render(); Sync.schedule();
}

/* Keyboard equivalent of a drag — WCAG 2.5.7 requires one, and it is the
   only way to reorder without a pointer. Alt + Arrow on a focused task. */
function nudge(id, dir){
  const vis = visible();
  const from = vis.findIndex(t => t.id === id);
  if(from < 0) return;
  const to = from + dir;
  // stay inside your own group; open work and done work do not interleave
  if(to < 0 || to >= vis.length || vis[to].done !== vis[from].done) return;

  const moved = vis.splice(from,1)[0];
  vis.splice(to,0,moved);
  commitOrder(vis);
  render();
  announce(`Moved ${moved.title} ${dir < 0 ? 'up' : 'down'}, position ${to + 1} of ${vis.length}`);
  const el = document.querySelector(`.item[data-id="${id}"] .disc`);
  if(el) el.focus();
}

/* Writes a reordered *visible* list back into state.tasks, leaving tasks
   hidden by the current filter exactly where they were. */
function commitOrder(newVisible){
  const ids = new Set(newVisible.map(t => t.id));
  let k = 0;
  state.tasks = state.tasks.map(t => ids.has(t.id) ? newVisible[k++] : t);
  if(!state.prefs.reordered) state.prefs.reordered = true;
  bumpOrder();
  save(); Sync.schedule();
}

/* Ordering cannot merge task-by-task — two devices with different orders
   have no automatic reconciliation that isn't a guess. So it is a single
   whole-document decision, and this is the timestamp that decides it. */
function bumpOrder(){ state.sync.orderUpdatedAt = Date.now(); }

function announce(msg){
  const el = $('#live');
  el.textContent = '';
  setTimeout(() => { el.textContent = msg; }, 30);
}

/* Deleting writes a tombstone rather than removing the row. Without it a
   device holding an older copy would re-upload the task on its next sync
   and it would come back from the dead. */
function remove(id){
  const t = state.tasks.find(x => x.id === id);
  if(!t || t.deletedAt) return;
  t.deletedAt = t.updatedAt = Date.now();
  if(openId === id) openId = null;
  save(); render(); Sync.schedule();
  showToast('Task deleted', () => {
    t.deletedAt = null; t.updatedAt = Date.now();
    save(); render(); Sync.schedule();
  });
}

function clearCompleted(){
  const gone = live().filter(t => t.done);
  if(!gone.length){ showToast('Nothing completed yet', null); return; }
  const at = Date.now();
  gone.forEach(t => { t.deletedAt = at; t.updatedAt = at; });
  save(); render(); closeMenu(); Sync.schedule();
  showToast(`${gone.length} cleared`, () => {
    const back = Date.now();
    gone.forEach(t => { t.deletedAt = null; t.updatedAt = back; });
    save(); render(); Sync.schedule();
  });
}

/* ═══════════════════════════════════════════════════════════════════
   SHEET
   ═══════════════════════════════════════════════════════════════════ */
function openSheet(id){
  editingId = id || null;
  const t = id ? state.tasks.find(x => x.id === id) : null;
  draftCat = t ? t.category : (state.prefs.filter === 'work' ? 'work' : 'personal');

  $('#sheetTtl').textContent = t ? 'Edit task' : 'New task';
  $('#submitBtn').textContent = t ? 'Save changes' : 'Add task';
  $('#fTitle').value = t ? t.title : '';
  $('#fNotes').value = t ? t.notes : '';
  syncChips();

  $('#sheet').dataset.open = 'true';
  $('#scrim').dataset.open = 'true';
  closeMenu();
  setTimeout(() => $('#fTitle').focus(), 60);
}

function closeSheet(){
  $('#sheet').dataset.open = 'false';
  if($('#menu').dataset.open !== 'true') $('#scrim').dataset.open = 'false';
  editingId = null;
}

const syncChips = () => $$('.chip').forEach(c =>
  c.setAttribute('aria-pressed', String(c.dataset.cat === draftCat)));

$$('.chip').forEach(c => c.addEventListener('click', () => { draftCat = c.dataset.cat; syncChips(); }));

$('#form').addEventListener('submit', e => {
  e.preventDefault();
  const title = $('#fTitle').value.trim();
  if(!title) return;
  const notes = $('#fNotes').value.trim();

  if(editingId){
    const t = state.tasks.find(x => x.id === editingId);
    if(t){ t.title = title; t.notes = notes; t.category = draftCat; t.updatedAt = Date.now(); }
  }else{
    state.tasks.push({
      id: uid(), title, category: draftCat, notes,
      done:false, createdAt: Date.now(), completedAt:null,
      updatedAt: Date.now(), deletedAt:null
    });
    bumpOrder();
    // if the new task would be hidden by the active filter, show it
    if(state.prefs.filter !== 'all' && state.prefs.filter !== draftCat){
      state.prefs.filter = draftCat;
    }
  }
  save(); closeSheet(); render(); Sync.schedule();
  $('#list').scrollTop = $('#list').scrollHeight;
});

/* Enter saves from the title field; Cmd/Ctrl+Enter saves from notes. */
$('#fTitle').addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); $('#form').requestSubmit(); }
});
$('#fNotes').addEventListener('keydown', e => {
  if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); $('#form').requestSubmit(); }
});

/* ═══════════════════════════════════════════════════════════════════
   MENU
   ═══════════════════════════════════════════════════════════════════ */
function openMenu(){
  $('#menu').dataset.open = 'true';
  $('#scrim').dataset.open = 'true';
  $('#menuBtn').setAttribute('aria-expanded','true');
}
function closeMenu(){
  $('#menu').dataset.open = 'false';
  $('#menuBtn').setAttribute('aria-expanded','false');
  if($('#sheet').dataset.open !== 'true') $('#scrim').dataset.open = 'false';
}
$('#menuBtn').addEventListener('click', () =>
  $('#menu').dataset.open === 'true' ? closeMenu() : openMenu());

$$('.menu button[data-theme]').forEach(b => b.addEventListener('click', () => {
  state.prefs.theme = b.dataset.theme;
  applyTheme(); save(); render();
}));

$('#fName').addEventListener('input', e => {
  state.prefs.name = e.target.value.replace(/\s+/g,' ').slice(0,24);
  state.sync.nameUpdatedAt = Date.now();
  save(); $('#greet').textContent = greeting();
  Sync.schedule();
});

/* What the eye currently sees, which is not the same as the stored
   preference: 'system' could be resolving to either. */
function isDark(){
  const t = document.documentElement.getAttribute('data-theme');
  if(t === 'dark') return true;
  if(t === 'light') return false;
  return matchMedia('(prefers-color-scheme: dark)').matches;
}

/* The globe flips whatever you are looking at, which also means it steps
   out of 'Auto' the moment you use it. Auto stays available in the menu. */
function toggleTheme(){
  state.prefs.theme = isDark() ? 'light' : 'dark';
  applyTheme(); save(); render();
}

function applyTheme(){
  const t = state.prefs.theme;
  if(t === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
}

/* ═══════════════════════════════════════════════════════════════════
   EXPORT / IMPORT
   ═══════════════════════════════════════════════════════════════════ */
$('#expBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const stamp = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  a.href = url; a.download = `todo-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  closeMenu(); showToast('Backup downloaded', null);
});

$('#impBtn').addEventListener('click', () => $('#impFile').click());
$('#impFile').addEventListener('change', async e => {
  const file = e.target.files?.[0];
  e.target.value = '';
  if(!file) return;
  try{
    const parsed = Store.migrate(JSON.parse(await file.text()));
    if(!parsed.tasks.length && !confirm('That backup has no tasks. Import anyway?')) return;
    const before = state;
    state = parsed;
    bumpOrder();
    applyTheme(); save(); render(); closeMenu(); Sync.schedule();
    showToast(`${parsed.tasks.length} imported`, () => { state = before; applyTheme(); save(); render(); });
  }catch(err){
    console.warn(err);
    showToast("Couldn't read that file", null);
  }
});

});

/* ═══════════════════════════════════════════════════════════════════
   TOAST
   ═══════════════════════════════════════════════════════════════════ */
function showToast(msg, restore){
  undo = restore;
  $('#toastMsg').textContent = msg;
  $('#toastAct').style.display = restore ? '' : 'none';
  $('#toast').dataset.open = 'true';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, restore ? 6000 : 2600);
}
function hideToast(){ $('#toast').dataset.open = 'false'; undo = null; }
$('#toastAct').addEventListener('click', () => { if(undo) undo(); hideToast(); });

/* ═══════════════════════════════════════════════════════════════════
   SYNC

   The second adapter the storage seam was built for. Local writes still
   go to localStorage first and always succeed — the network is treated
   as a slow, unreliable second opinion, never as a gatekeeper. The app
   works identically with sync off or with no signal.

   The list key is the only credential. It lives in the URL fragment,
   which browsers never send to any server, and is copied into
   localStorage so the installed app (which launches without the
   fragment) still knows it.
   ═══════════════════════════════════════════════════════════════════ */
const Sync = (() => {
  const ENDPOINT = 'https://todo-sync.dry-wave-17f6.workers.dev';
  const DEBOUNCE = 1500;     // collapse a burst of edits into one write
  const POLL     = 45000;    // while the app is open and visible
  let timer = 0, poll = 0, inFlight = false, dirty = false, status = 'idle';

  const on = () => !!(state.sync.enabled && state.sync.key);

  function newKey(){
    const b = new Uint8Array(24);
    crypto.getRandomValues(b);                       // 192 bits
    return btoa(String.fromCharCode(...b)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }

  function link(){
    return location.origin + location.pathname + '#k=' + state.sync.key;
  }

  /* The document that travels. Device preferences deliberately stay
     behind — you do not want your phone forcing dark mode on your
     laptop just because it synced last. */
  function outbound(){
    return {
      tasks: state.tasks,
      order: state.tasks.map(t => t.id),
      orderUpdatedAt: state.sync.orderUpdatedAt || 0,
      name: state.prefs.name || '',
      nameUpdatedAt: state.sync.nameUpdatedAt || 0
    };
  }

  function absorb(doc){
    if(!doc || !Array.isArray(doc.tasks)) return false;
    const before = JSON.stringify(state.tasks.map(t => [t.id, t.updatedAt, t.deletedAt]));
    state.tasks = Store.migrate({ tasks: doc.tasks }).tasks;
    state.sync.orderUpdatedAt = doc.orderUpdatedAt || state.sync.orderUpdatedAt || 0;
    if((doc.nameUpdatedAt || 0) > (state.sync.nameUpdatedAt || 0)){
      state.prefs.name = doc.name || '';
      state.sync.nameUpdatedAt = doc.nameUpdatedAt;
    }
    state.sync.lastSyncAt = Date.now();
    save();
    return before !== JSON.stringify(state.tasks.map(t => [t.id, t.updatedAt, t.deletedAt]));
  }

  async function call(path, body){
    const res = await fetch(ENDPOINT + path, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ key: state.sync.key, ...body })
    });
    if(!res.ok) throw new Error((await res.json().catch(()=>({}))).error || res.status);
    return res.json();
  }

  async function run(){
    if(!on() || inFlight) return;
    if(!navigator.onLine){ setStatus('offline'); dirty = true; return; }
    inFlight = true; dirty = false; setStatus('syncing');
    try{
      // push returns the merged document, so one round trip both sends
      // our changes and collects whatever the other device did
      const { doc } = await call('/push', { doc: outbound() });
      const changed = absorb(doc);
      setStatus('ok');
      if(changed) render();
    }catch(err){
      console.warn('sync failed', err);
      dirty = true;
      setStatus(String(err.message||err) === 'origin_not_allowed' ? 'blocked' : 'error');
    }finally{
      inFlight = false;
      if(dirty) schedule();
    }
  }

  function schedule(){
    if(!on()) return;
    dirty = true;
    clearTimeout(timer);
    timer = setTimeout(run, DEBOUNCE);
  }

  function setStatus(s){ status = s; paintStatus(); }

  function paintStatus(){
    const el = $('#syncState'); if(!el) return;
    if(!on()){ el.textContent = 'Off'; return; }
    const ago = state.sync.lastSyncAt
      ? Math.round((Date.now() - state.sync.lastSyncAt)/1000) : null;
    el.textContent =
      status === 'syncing' ? 'Syncing…' :
      status === 'offline' ? 'Offline — will retry' :
      status === 'blocked' ? 'Blocked by server' :
      status === 'error'   ? 'Failed — will retry' :
      ago === null         ? 'On' :
      ago < 60             ? 'Synced just now' :
      `Synced ${Math.round(ago/60)} min ago`;
  }

  async function enable(existingKey){
    state.sync.key = existingKey || state.sync.key || newKey();
    state.sync.enabled = true;
    save();
    await run();
    paintUI();
  }

  function disable(){
    state.sync.enabled = false;
    clearTimeout(timer); clearInterval(poll); poll = 0;
    save(); paintUI();
    // the key is kept, so turning sync back on rejoins the same list
  }

  function paintUI(){
    $('#syncPanel').hidden = !on();
    $('#syncToggle').textContent = on() ? 'Turn off' : 'Turn on';
    $('#syncLink').value = on() ? link() : '';
    paintStatus();
    if(on() && !poll) poll = setInterval(() => { if(!document.hidden) run(); }, POLL);
  }

  /* A key arriving in the fragment means "join this list". Adopt it,
     then scrub it from the address bar so it does not sit in a shared
     screenshot or get bookmarked by accident. */
  function adoptFromUrl(){
    const m = location.hash.match(/[#&]k=([A-Za-z0-9_-]{32,64})/);
    if(!m) return false;
    state.sync.key = m[1];
    state.sync.enabled = true;
    save();
    history.replaceState(null, '', location.pathname + location.search);
    return true;
  }

  function init(){
    const joined = adoptFromUrl();
    paintUI();
    if(on()) run();
    if(joined) showToast('Joined synced list', null);
    window.addEventListener('online',  () => { if(on()) run(); });
    window.addEventListener('offline', () => setStatus('offline'));
    document.addEventListener('visibilitychange', () => { if(!document.hidden && on()) run(); });
  }

  return { init, enable, disable, schedule, paintUI, link, isOn: on, run };
})();

/* ═══════════════════════════════════════════════════════════════════
   SWIPE TO SEND TO TODAY

   Three gestures now start from the same pointerdown on a row:
     · a vertical drag  -> scroll the list
     · a horizontal drag -> reveal the Today action
     · a still press     -> pick the task up to reorder

   They are separated by locking the axis on the first few pixels of
   movement. Whichever direction wins, wins for the whole gesture, so a
   sloppy diagonal never does two things at once. Below the threshold
   nothing is claimed, which is what leaves room for the long-press.

   Reveal-then-tap, not swipe-past-a-threshold: a stray thumb should not
   silently reshuffle your day.
   ═══════════════════════════════════════════════════════════════════ */
const Swipe = (() => {
  const WIDTH  = 88;   // must match .swipe-actions
  const LOCK   = 8;    // travel before an axis is claimed
  const SNAP   = WIDTH * 0.45;
  let g = null, openRow = null;

  function closeAll(except){
    if(openRow && openRow !== except){
      openRow.style.transform = '';
      openRow.closest('.item')?.classList.remove('swiping');
      openRow = null;
    }
  }

  function maybeStart(e, wrap, row){
    if(e.button > 0) return;
    if(e.target.closest('.chk, .mini, .today-btn, .row-today')) return;
    if(e.pointerType !== 'touch') return;      // mouse users get the hover button
    if($('#sheet').dataset.open === 'true' || $('#menu').dataset.open === 'true') return;

    g = { wrap, row, id: e.pointerId, x0: e.clientX, y0: e.clientY,
          axis: null, base: row === openRow ? WIDTH : 0 };
    window.addEventListener('pointermove', onMove, {passive:false});
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  }

  function onMove(e){
    if(!g || e.pointerId !== g.id) return;
    const dx = e.clientX - g.x0, dy = e.clientY - g.y0;

    if(!g.axis){
      if(Math.abs(dx) < LOCK && Math.abs(dy) < LOCK) return;   // still undecided
      if(Math.abs(dy) >= Math.abs(dx)){ end(); return; }        // vertical: not ours
      g.axis = 'x';
      Drag.abort();                       // the reorder long-press loses this one
      g.wrap.classList.add('swiping');
      closeAll(g.row);
    }

    e.preventDefault();                   // stop the list scrolling under us
    const x = Math.max(0, Math.min(WIDTH, g.base + dx));
    g.row.style.transform = `translateX(${x}px)`;
    g.last = x;
  }

  function onUp(){
    if(!g) return;
    if(g.axis === 'x'){
      const open = (g.last ?? g.base) > SNAP;
      g.wrap.classList.remove('swiping');
      g.row.style.transform = open ? `translateX(${WIDTH}px)` : '';
      openRow = open ? g.row : null;
    }
    end();
  }

  function end(){
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    g = null;
  }

  return { maybeStart, closeAll: () => closeAll(null), isOpen: () => !!openRow };
})();

/* ═══════════════════════════════════════════════════════════════════
   DRAG TO REORDER

   Pointer Events, not HTML5 drag-and-drop — the latter does not exist on
   iOS Safari, so it would have worked on your laptop and silently failed
   on your phone.

   Pickup differs by input: a mouse drags after 5px of movement, a finger
   needs a 220ms long-press first. Without that delay every attempt to
   scroll the list would pick a task up instead.
   ═══════════════════════════════════════════════════════════════════ */
const Drag = (() => {
  const LONG_PRESS = 220;   // finger must rest this long before it lifts a task
  const MOUSE_SLOP = 5;     // mouse travel that separates a drag from a click
  const TOUCH_SLOP = 10;    // finger travel before the long-press is abandoned
  const EDGE = 44;          // auto-scroll zone at each end of the list
  const SPEED = 12;

  let pending = null, active = null, justDragged = false, raf = 0;
  const list = () => $('#list');

  function maybeStart(e, wrap){
    if(e.button > 0) return;                                  // right/middle click
    if(e.target.closest('.chk, .mini')) return;               // their own controls
    if($('#sheet').dataset.open === 'true') return;
    if($('#menu').dataset.open === 'true') return;
    if(list().children.length < 2) return;                    // nothing to reorder

    pending = { wrap, pointerId: e.pointerId, type: e.pointerType,
                x0: e.clientX, y0: e.clientY, y: e.clientY, timer: 0,
                trusted: e.isTrusted };
    if(e.pointerType === 'touch'){
      pending.timer = setTimeout(() => { if(pending) begin(); }, LONG_PRESS);
    }
    window.addEventListener('pointermove', onMove, {passive:false});
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    // iOS only honours preventDefault from a non-passive touchmove listener
    document.addEventListener('touchmove', blockScroll, {passive:false});
  }

  function begin(){
    if(!pending) return;
    const wrap = pending.wrap;
    const items = [...list().children];
    const index = items.indexOf(wrap);
    if(index < 0){ cancelPending(); return; }

    const el = list(), lr = el.getBoundingClientRect();
    const vis = visible();

    // a task may only be dropped within its own group — dragging finished
    // work back up among open work would just snap back
    const isDone = vis[index] ? vis[index].done : false;
    let lo = 0;
    while(lo < vis.length && vis[lo].done !== isDone) lo++;
    let hi = lo;
    while(hi + 1 < vis.length && vis[hi + 1].done === isDone) hi++;

    active = {
      wrap, items, index, target: index,
      rects: items.map(n => ({top: n.offsetTop, h: n.offsetHeight})),
      h: wrap.offsetHeight,
      startContentY: pending.y - lr.top + el.scrollTop,
      pointerY: pending.y, dy: 0, lo, hi,
      pointerId: pending.pointerId
    };
    const trusted = pending.trusted;
    clearTimeout(pending.timer);
    pending = null;

    wrap.classList.add('item--drag');
    el.classList.add('list--dragging');
    try { wrap.setPointerCapture(active.pointerId); } catch(_){}
    // browsers reject vibrate outside a real user gesture and log an error
    if(trusted && navigator.vibrate) { try { navigator.vibrate(8); } catch(_){} }
  }

  function onMove(e){
    if(pending && e.pointerId === pending.pointerId){
      pending.y = e.clientY;
      const dx = Math.abs(e.clientX - pending.x0), dy = Math.abs(e.clientY - pending.y0);
      if(pending.type === 'touch'){
        if(dx > TOUCH_SLOP || dy > TOUCH_SLOP) cancelPending();   // they meant to scroll
      }else if(dx > MOUSE_SLOP || dy > MOUSE_SLOP){
        begin();
      }
      return;
    }
    if(!active || e.pointerId !== active.pointerId) return;
    e.preventDefault();
    active.pointerY = e.clientY;
    schedule();
  }

  function schedule(){
    if(raf) return;
    raf = requestAnimationFrame(() => { raf = 0; update(); });
  }

  function update(){
    if(!active) return;
    const el = list(), lr = el.getBoundingClientRect(), y = active.pointerY;

    // drag toward either end and the list follows
    const atTop = y < lr.top + EDGE, atBottom = y > lr.bottom - EDGE;
    if(atTop && el.scrollTop > 0) el.scrollTop -= SPEED;
    else if(atBottom && el.scrollTop < el.scrollHeight - el.clientHeight) el.scrollTop += SPEED;

    active.dy = (y - lr.top + el.scrollTop) - active.startContentY;
    active.target = computeTarget();
    applyTransforms();

    if(atTop || atBottom) schedule();   // keep going while parked at the edge
  }

  /* Compare the dragged item's edges against the untouched midpoints of its
     neighbours. Works with variable row heights, which matters because an
     expanded task is much taller than a collapsed one. */
  function computeTarget(){
    const {rects, index, dy, h, lo, hi} = active;
    const top = rects[index].top + dy, bottom = top + h;
    let target = index;
    for(let j = lo; j <= hi; j++){
      if(j === index) continue;
      const mid = rects[j].top + rects[j].h / 2;
      if(j < index && top < mid) target = Math.min(target, j);
      if(j > index && bottom > mid) target = Math.max(target, j);
    }
    return target;
  }

  function applyTransforms(){
    const {items, index, target, h, dy} = active;
    items.forEach((n, j) => {
      if(j === index){ n.style.transform = `translateY(${dy}px)`; return; }
      let shift = 0;
      if(j > index && j <= target) shift = -h;
      else if(j < index && j >= target) shift = h;
      n.style.transform = shift ? `translateY(${shift}px)` : '';
    });
  }

  function onUp(e){
    if(pending){ cancelPending(); detach(); return; }
    if(!active){ detach(); return; }
    if(e && e.pointerId !== active.pointerId) return;

    const {index, target, items, wrap} = active;
    items.forEach(n => { n.style.transform = ''; });
    wrap.classList.remove('item--drag');
    list().classList.remove('list--dragging');
    try { wrap.releasePointerCapture(active.pointerId); } catch(_){}

    // a drag always ends in a click event; swallow it so releasing a task
    // does not also toggle its notes open
    justDragged = true;
    setTimeout(() => { justDragged = false; }, 350);

    if(index !== target){
      const vis = visible();
      const moved = vis.splice(index, 1)[0];
      vis.splice(target, 0, moved);
      commitOrder(vis);
      active = null; detach();
      render();
      announce(`Moved ${moved.title} to position ${target + 1} of ${vis.length}`);
      return;
    }
    active = null;
    detach();
  }

  function blockScroll(e){ if(active) e.preventDefault(); }
  function cancelPending(){ if(pending){ clearTimeout(pending.timer); pending = null; } }

  function detach(){
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    document.removeEventListener('touchmove', blockScroll);
  }

  function abort(){
    if(!active){ cancelPending(); detach(); return; }
    active.items.forEach(n => { n.style.transform = ''; });
    active.wrap.classList.remove('item--drag');
    list().classList.remove('list--dragging');
    active = null; detach();
  }

  return {
    maybeStart,
    abort,
    isActive: () => !!active,
    consumedClick(){ const c = justDragged; justDragged = false; return c; }
  };
})();

/* ═══════════════════════════════════════════════════════════════════
   WIRING
   ═══════════════════════════════════════════════════════════════════ */
$$('.seg button[data-filter]').forEach(b => b.addEventListener('click', () => {
  Swipe.closeAll();
  state.prefs.filter = b.dataset.filter; openId = null; save(); render();
}));
$('#addBtn').addEventListener('click', () => openSheet(null));
$('#sheetClose').addEventListener('click', closeSheet);
$('#scrim').addEventListener('click', () => { closeSheet(); closeMenu(); });
$('#list').addEventListener('scroll', () => Swipe.closeAll(), {passive:true});

document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName);
  if(e.key === 'Escape'){ Drag.abort(); Swipe.closeAll(); closeSheet(); closeMenu(); hideToast(); return; }
  if(!typing && (e.key === 'n' || e.key === 'N') && !e.metaKey && !e.ctrlKey){
    e.preventDefault(); openSheet(null);
  }
  if(!typing && (e.key === 't' || e.key === 'T') && !e.metaKey && !e.ctrlKey){
    const row = document.activeElement?.closest?.('.item');
    if(row){ e.preventDefault(); toggleToday(row.dataset.id); }
  }
});

/* Keep the tab honest if the same list is open twice in one browser. */
window.addEventListener('storage', e => {
  if(e.key === 'todo.v1'){ state = Store.read(); applyTheme(); render(); }
});

applyTheme();
rolloverToday();
render();
Sync.init();

/* The day can turn over while the app sits open on a desk overnight. */
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && rolloverToday()){ render(); Sync.schedule(); }
});
setInterval(() => { if(rolloverToday()){ render(); Sync.schedule(); } }, 5 * 60 * 1000);

if('serviceWorker' in navigator){
  window.addEventListener('load', () =>
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW failed', err)));
}
</script>
